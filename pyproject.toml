[project]
name = "netology-project-ii"
version = "0.1.0"
description = "Дипломный проект"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "fastapi (>=0.138.0,<0.139.0)",
    "openai (>=2.43.0,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "openinference-instrumentation-openai>=0.1.52",
    "arize-phoenix>=17.14.0",
    "structlog>=26.1.0",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "spacy>=3.8.13",
    "pip>=26.1.2",
    "jinja2>=3.1.6",
    "sentence-transformers>=5.6.0",
    "qdrant-client>=1.14",
    "llama-index>=0.14.23",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "llama-index-readers-file>=0.6.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-ollama>=0.10.1",
    "llama-index-llms-openrouter>=0.5.1",
    "pymupdf>=1.28.0",
    "llama-index-llms-openai-like>=0.7.2",
    "chandra-ocr[hf]>=0.2.0",
    "nltk>=3.10.0",
    "unstructured>=0.27.1",
    "fastembed>=0.8.0",
    "aiofiles>=25.1.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "tiktoken>=0.13.0",
    "aiogram>=3.27",
    "aiohttp-socks>=0.11.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[project.optional-dependencies]
# Группа для оценки (Evaluation)
eval = [
    "ragas>=0.4.0,<0.5.0",
    "langchain-community<0.4.0", # Важный пин для исправления поломки импорта vertexai в ragas 0.4.x
    "anthropic>=0.40.0",         # Прямой современный клиент для LLM-судьи
    "pandas>=2.0.0",
    "arize-phoenix>=5.0.0"
]


# Группа для логирования и трассировки (Tracing)
tracing = [
    "openinference-instrumentation-llama-index>4",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

