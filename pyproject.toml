[project]
name = "netology-project-ii"
version = "0.1.0"
description = "Дипломный проект"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "fastapi (>=0.138.0,<0.139.0)",
    "openai (>=2.43.0,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "openinference-instrumentation-openai>=0.1.52",
    "arize-phoenix>=17.14.0",
    "structlog>=26.1.0",
    "presidio-analyzer>=2.2.363",
    "presidio-anonymizer>=2.2.363",
    "spacy>=3.8.13",
    "pip>=26.1.2",
    "jinja2>=3.1.6",
    "aiofiles>=25.1.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "tiktoken>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

